const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(SALT), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, key, bytes(CT));
  const html = new TextDecoder().decode(plain);
  try { sessionStorage.setItem("mockup_pw", pw); } catch (_) {}
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", async e => {

  const err = document.getElementById("err"); err.textContent = "";
  try { await unlock(document.getElementById("pw").value); } catch (_) { err.textContent = "That password didn't work."; }
});
